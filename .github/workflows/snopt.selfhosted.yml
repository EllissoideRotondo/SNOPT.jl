name: SNOPT Tests

on:
  push:
    branches: ['**']

  workflow_dispatch:

permissions:
  contents: read
  # Codecov authenticates the coverage upload with a GitHub OIDC token.
  id-token: write

concurrency:
  group: snopt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Julia ${{ matrix.julia }} / SNOPT

    runs-on:
      - self-hosted
      - linux
      - x64
      - snopt

    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        julia:
          - '1.11'
          - '1'

    env:
      SNOPTDIR: /opt/snopt
      # Two threads so that the concurrency test of the workspace lock runs.
      JULIA_NUM_THREADS: '2'

    steps:
      - uses: actions/checkout@v4

      - name: Verify SNOPT library is mounted
        run: |
          test -r /opt/snopt/libsnopt7.so
          ldd /opt/snopt/libsnopt7.so

      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia }}

      - uses: julia-actions/cache@v2

      - name: Instantiate
        run: |
          julia --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: Verify SNOPT.jl detects SNOPT
        run: |
          julia --project=. -e '
            using SNOPT
            println("SNOPT library: ", SNOPT.libsnopt7)
            @assert SNOPT.has_snopt()
          '

      - name: Run tests
        env:
          SNOPT_REQUIRE_LIBRARY: 'true'
        run: |
          julia --project=. -e 'using Pkg; Pkg.test(coverage = true)'

      # This job is the only one that runs the solver tests, so it is the only
      # source of coverage.
      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.julia == '1'

      - uses: codecov/codecov-action@v5
        if: matrix.julia == '1'
        with:
          files: lcov.info
          use_oidc: true
          fail_ci_if_error: true

      - name: Run examples
        run: |
          julia --project=. examples/unconstrained.jl
          julia --project=. examples/hs71.jl

      - name: Validate solver documentation
        if: matrix.julia == '1'
        env:
          SNOPT_DOCTESTS: 'true'
          SNOPT_DOCS_DEPLOY: 'false'
        run: |
          julia --project=docs -e '
            using Pkg
            Pkg.develop(PackageSpec(path=pwd()))
            Pkg.instantiate()'
          julia --project=docs docs/make.jl
